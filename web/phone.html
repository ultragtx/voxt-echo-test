<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo test · Phone</title>
<style>
  body { font: 17px/1.5 -apple-system, sans-serif; margin: 0; padding: 24px 20px; color: #222; text-align: center; }
  h1 { font-size: 20px; }
  #lang { position: absolute; top: 12px; right: 16px; font-size: 14px; }
  button { font: inherit; font-size: 22px; padding: 18px 40px; border-radius: 14px; border: 0; background: #0a66d8; color: #fff; }
  button:disabled { opacity: .4; }
  #state { font-size: 24px; font-weight: 600; margin: 28px 0 8px; }
  #detail { color: #555; min-height: 3em; white-space: pre-line; }
  .hint { color: #777; font-size: 14px; text-align: left; margin-top: 32px; }
  .ok { color: #188038; } .warn { color: #c5221f; }
  video { position: fixed; width: 1px; height: 1px; opacity: .01; bottom: 0; left: 0; }
</style>
</head>
<body data-title="phoneTitle">
<h1 data-t="phoneTitle"></h1>
<button id="arm" data-t="phoneArm"></button>
<div id="state" data-t="notReady"></div>
<div id="detail"></div>
<div class="hint" data-t="phoneHints"></div>
<video id="nosleep" src="/nosleep.mp4" muted playsinline loop></video>

<script src="/common.js"></script>
<script>
applyStrings();

let ctx, buf, info, source = null, progressTimer = null;

listen('phone', ev => {
  if (!buf) return;
  if (ev.type === 'calibrate') {
    play(ev.at, ev.from, ev.to - ev.from, false);
  } else if (ev.type === 'start') {
    play(ev.at, 0, undefined, true);
  } else if (ev.type === 'stop') {
    stop(t('stopped'));
  } else if (ev.type === 'done') {
    stop(`<span class="ok">${t('done')}</span>`);
  }
});

$('arm').onclick = async () => {
  if (navigator.audioSession) navigator.audioSession.type = 'playback';
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const unlock = ctx.createBufferSource();
  unlock.buffer = ctx.createBuffer(1, 1, 22050);
  unlock.connect(ctx.destination);
  unlock.start();
  $('nosleep').play().catch(() => {});
  $('arm').disabled = true;
  $('state').textContent = t('loading');
  try {
    await ctx.resume();
    info = await (await fetch('/info')).json();
    buf = await loadBuffer(ctx, '/audio/mic.wav');
    await syncClock();
    setInterval(() => { if (!source) syncClock(); }, 20000);
    $('state').innerHTML = `<span class="ok">${t('ready')}</span>`;
    $('detail').textContent = t('waiting', Math.ceil(clockRtt / 2));
    post({ action: 'armed', role: 'phone', armed: true });
  } catch (e) {
    $('state').innerHTML = `<span class="warn">${t('error', e.message)}</span>`;
    $('arm').disabled = false;
  }
};

async function play(at, offset, duration, test) {
  stop();
  await ctx.resume();
  const src = ctx.createBufferSource();
  source = src;
  src.buffer = buf;
  src.connect(ctx.destination);
  src.onended = () => { if (source === src && !test) stop(`<span class="ok">${t('ready')}</span>`, t('calibrated')); };
  src.start(ctxTimeAt(ctx, at), offset, duration);
  $('state').textContent = test ? t('testing') : t('calibrating');
  progressTimer = setInterval(() => {
    const sec = (serverNow() - at) / 1000;
    if (!test) { $('detail').textContent = sec < 0 ? t('playsIn', (-sec).toFixed(1)) : t('playing'); return; }
    const k = slotAt(info, sec);
    $('detail').textContent = sec < 0
      ? t('startsIn', (-sec).toFixed(1))
      : `${sec.toFixed(0)} / ${info.duration.toFixed(0)} s\n${k ? slotLabel(info, k) : ''}`;
  }, 200);
}

function stop(state, detail = '') {
  if (source) { const s = source; source = null; try { s.stop(); } catch (e) {} }
  clearInterval(progressTimer);
  if (state) { $('state').innerHTML = state; $('detail').textContent = detail; }
}
</script>
</body>
</html>
