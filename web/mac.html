<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo test · Mac</title>
<style>
  body { font: 15px/1.5 -apple-system, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 20px; } h2 { font-size: 16px; margin-top: 28px; }
  #lang { float: right; font-size: 14px; }
  button { font: inherit; padding: 8px 16px; margin: 4px 8px 4px 0; border-radius: 8px; border: 1px solid #999; background: #f4f4f4; cursor: pointer; }
  button.primary { background: #0a66d8; color: #fff; border-color: #0a66d8; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .ok { color: #188038; } .warn { color: #c5221f; } .dim { color: #777; }
  #meter { position: relative; height: 22px; background: #eee; border-radius: 4px; overflow: hidden; flex: 1; min-width: 240px; }
  #bar { position: absolute; inset: 0 auto 0 0; background: #34a853; width: 0; }
  #peak { position: absolute; top: 0; bottom: 0; width: 2px; background: #222; left: 0; }
  #db { font-variant-numeric: tabular-nums; width: 90px; }
  .read { background: #fff8e1; padding: 10px 14px; border-radius: 8px; font-size: 17px; }
  table { border-collapse: collapse; margin-top: 8px; } td, th { padding: 4px 10px; border-bottom: 1px solid #eee; text-align: left; }
  tr.now { background: #e8f0fe; font-weight: 600; }
  #qr { margin-top: 8px; }
</style>
</head>
<body data-title="macTitle">
<h1 data-t="macTitle"></h1>
<p id="presence" class="dim" data-t="connecting"></p>

<h2 data-t="step1"></h2>
<p data-t="step1Body"></p>
<div id="qr"></div>

<h2 data-t="step2"></h2>
<button id="arm" class="primary" data-t="arm"></button>
<span id="armState" class="dim"></span>

<h2 data-t="step3"></h2>
<div class="row"><div id="meter"><div id="bar"></div><div id="peak"></div></div><span id="db">— dB</span></div>
<p class="dim" data-t="placement"></p>
<p data-t="readThis"></p>
<p class="read" id="micText"></p>
<div class="row"><button id="measureMe" data-t="measureMe" disabled></button><span id="me" class="dim">—</span></div>
<div class="row"><button id="measurePhone" data-t="measurePhone" disabled></button><span id="phone" class="dim">—</span></div>
<p id="diff"></p>

<h2 data-t="step4"></h2>
<p data-t="step4Body"></p>
<button id="start" class="primary" data-t="start" disabled></button>
<button id="stop" data-t="stop" disabled></button>
<p id="progress"></p>
<table id="slots"></table>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/common.js"></script>
<script>
applyStrings();

let ctx, buf, info, stream, micSource, meterNode, workletLoaded = false;
let collecting = null, peak = -100, peakAt = 0;
const levels = { me: null, phone: null };
let source = null, startAt = null, progressTimer = null;

(async () => {
  info = await (await fetch('/info')).json();
  const phoneUrl = info.phoneUrl + (LANG === 'en' ? '' : '?lang=' + LANG);
  $('phoneUrl').textContent = phoneUrl;
  $('micText').textContent = info.timeline.find(x => x.track === 'mic').text;
  try { new QRCode($('qr'), { text: phoneUrl, width: 140, height: 140 }); } catch (e) {}
  renderSlots(0);
})();

listen('mac', ev => {
  if (ev.type === 'presence') {
    $('presence').innerHTML = ev.connected.phone
      ? (ev.armed.phone ? `<span class="ok">${t('phoneArmed')}</span>` : t('phoneConnected'))
      : `<span class="warn">${t('phoneMissing')}</span>`;
  } else if (ev.type === 'calibrate') {
    measurePhone(ev);
  } else if (ev.type === 'start') {
    play(ev.at);
  } else if (ev.type === 'stop') {
    stopPlay(t('stopped'));
  } else if (ev.type === 'done') {
    stopPlay(`<span class="ok">${t('doneMac')}</span>`);
  }
});

$('arm').onclick = async () => {
  ctx = new AudioContext();
  await ctx.resume();
  $('armState').textContent = t('loading');
  buf = await loadBuffer(ctx, '/audio/system.wav');
  await openMic();
  await syncClock();
  $('armState').innerHTML = `<span class="ok">${t('ready')}</span>`;
  $('arm').disabled = true;
  ['measureMe', 'measurePhone', 'start'].forEach(id => $(id).disabled = false);
  post({ action: 'armed', role: 'mac', armed: true });
};

async function openMic() {
  if (stream) return;
  stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  if (!workletLoaded) {
    const code = `class Meter extends AudioWorkletProcessor {
      constructor() { super(); this.acc = 0; this.n = 0; }
      process(inputs) {
        const ch = inputs[0][0];
        if (ch) { for (let i = 0; i < ch.length; i++) this.acc += ch[i] * ch[i]; this.n += ch.length; }
        if (this.n >= 2048) { this.port.postMessage(this.acc / this.n); this.acc = 0; this.n = 0; }
        return true;
      }
    }
    registerProcessor('meter', Meter);`;
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([code], { type: 'application/javascript' })));
    workletLoaded = true;
  }
  micSource = ctx.createMediaStreamSource(stream);
  meterNode = new AudioWorkletNode(ctx, 'meter');
  const sink = ctx.createGain();
  sink.gain.value = 0;
  micSource.connect(meterNode).connect(sink).connect(ctx.destination);
  meterNode.port.onmessage = e => onPower(e.data);
}

// The microphone off during the test, so the page does not hold the input
// while Voxt records.
function closeMic() {
  if (!stream) return;
  stream.getTracks().forEach(track => track.stop());
  micSource.disconnect();
  meterNode.disconnect();
  stream = null;
  $('bar').style.width = 0;
  $('db').textContent = '— dB';
}

const pct = d => Math.max(0, Math.min(100, (d + 70) / 70 * 100));

function onPower(p) {
  const d = 10 * Math.log10(p + 1e-12);
  if (collecting) collecting.push(p);
  const now = performance.now();
  if (d > peak || now - peakAt > 1500) { peak = d; peakAt = now; }
  $('bar').style.width = pct(d) + '%';
  $('peak').style.left = pct(peak) + '%';
  $('db').textContent = d.toFixed(1) + ' dB';
}

// The level of the speech: the mean power of the frames within 30 dB of the loudest.
function speechLevel(ps) {
  const ds = ps.map(p => 10 * Math.log10(p + 1e-12));
  const top = Math.max(...ds);
  const kept = ps.filter((p, i) => ds[i] > top - 30 && ds[i] > -70);
  return kept.length ? 10 * Math.log10(kept.reduce((a, b) => a + b, 0) / kept.length) : null;
}

function collect(ms) {
  return new Promise(resolve => {
    collecting = [];
    setTimeout(() => { const ps = collecting; collecting = null; resolve(speechLevel(ps)); }, ms);
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

$('measureMe').onclick = async () => {
  await openMic();
  $('measureMe').disabled = true;
  for (const n of [3, 2, 1]) { $('me').textContent = `${n}…`; await sleep(1000); }
  $('me').textContent = t('readNow');
  levels.me = await collect(10000);
  $('me').textContent = levels.me == null ? t('noVoice') : t('myVoice', levels.me.toFixed(1));
  $('measureMe').disabled = false;
  showDiff();
};

$('measurePhone').onclick = async () => {
  await openMic();
  $('measurePhone').disabled = true;
  $('phone').textContent = t('phonePlaying');
  post({ action: 'calibrate' });
};

async function measurePhone(ev) {
  if (!stream) return;
  await sleep(msUntil(ev.at));
  levels.phone = await collect((ev.to - ev.from) * 1000 + 300);
  $('phone').textContent = levels.phone == null ? t('noPhone') : t('phoneLevel', levels.phone.toFixed(1));
  $('measurePhone').disabled = false;
  showDiff();
}

function showDiff() {
  if (levels.me == null || levels.phone == null) return;
  const d = levels.phone - levels.me;
  $('diff').innerHTML = Math.abs(d) <= 1.5
    ? `<span class="ok">${t('matched', d.toFixed(1))}</span>`
    : `<span class="warn">${t('mismatch', d > 0, Math.abs(d).toFixed(1))}</span>`;
}

$('start').onclick = () => {
  closeMic();
  $('start').disabled = true;
  post({ action: 'start' });
};
$('stop').onclick = () => post({ action: 'stop' });

function play(at) {
  closeMic();
  if (!buf) { $('progress').innerHTML = `<span class="warn">${t('macNotReady')}</span>`; return; }
  source = ctx.createBufferSource();
  source.buffer = buf;
  source.connect(ctx.destination);
  source.start(ctxTimeAt(ctx, at));
  startAt = at;
  $('start').disabled = true;
  $('stop').disabled = false;
  progressTimer = setInterval(() => {
    const sec = (serverNow() - startAt) / 1000;
    const k = slotAt(info, sec);
    $('progress').textContent = sec < 0
      ? t('startsIn', (-sec).toFixed(1))
      : t('progress', sec.toFixed(1), info.duration.toFixed(0), k ? slotLabel(info, k) : t('lead'));
    renderSlots(k);
  }, 200);
}

function stopPlay(message) {
  if (source) { try { source.stop(); } catch (e) {} source = null; }
  clearInterval(progressTimer);
  $('progress').innerHTML = message;
  renderSlots(0);
  $('start').disabled = !buf;
  $('stop').disabled = true;
}

function renderSlots(now) {
  if (!info) return;
  $('slots').innerHTML = `<tr><th>${t('slot')}</th><th>${t('system')}</th><th>${t('mic')}</th></tr>` + info.schedule.map((_, i) => {
    const k = i + 1;
    const p = slotParts(info, k);
    return `<tr class="${k === now ? 'now' : ''}"><td>${k}</td><td>${p.system}</td><td>${p.mic}</td></tr>`;
  }).join('');
}
</script>
</body>
</html>
